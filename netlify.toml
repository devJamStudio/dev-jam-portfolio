[build]
  command = "gatsby build"
  publish = "public"

[build.environment]
  # Gatsby 5 is not compatible with current Node LTS defaults; pin it.
  # .nvmrc holds the same value and takes precedence — keep them in step.
  NODE_VERSION = "20.12.2"

# --- Caching -----------------------------------------------------------------
# Gatsby fingerprints its JS/CSS and everything under /static, so those can be
# cached forever. HTML and page-data must NOT be: they are how a client learns
# about a new build, and serving them stale breaks client-side navigation after
# a deploy.

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# File names carry no hash; rename the file if the font ever changes.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/page-data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# --- Security ----------------------------------------------------------------
# No CSP here on purpose: the page loads the Adobe Fonts kit and Gatsby emits
# inline bootstrap scripts, so a policy tight enough to be worth having would
# need testing against every page first.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# --- Domain --------------------------------------------------------------------
# devjam.space is primary; Netlify does not redirect its own subdomain, so the
# old host would keep serving a duplicate. Deploy previews use other hostnames
# (deploy-preview-N--devjamstudio.netlify.app) and are unaffected.

# The stack page was folded into About.
[[redirects]]
  from = "/tech-stack/*"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/pl/tech-stack/*"
  to = "/pl/about/"
  status = 301

[[redirects]]
  from = "https://devjamstudio.netlify.app/*"
  to = "https://devjam.space/:splat"
  status = 301
  force = true
